spring.application.name=clinicflow

# MySQL (Workbench) - localhost:3306
# createDatabaseIfNotExist=true creates the "clinicflow" database for you
# Set DB_USERNAME / DB_PASSWORD via environment variables or a gitignored application-local.properties
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/clinicflow?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Creates / updates the tables from the entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8080

# Invite code required for public /api/auth/register-staff self-registration
clinicflow.staff.access-code=${STAFF_ACCESS_CODE:CLINICFLOW-STAFF-2026}
